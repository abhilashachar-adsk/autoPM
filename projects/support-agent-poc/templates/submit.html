{% extends "base.html" %}

{% block title %}Submit Support Request{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Submit Support Request</h1>
    <p class="subtitle">Describe your issue and our AI will route it to the right teams</p>
</div>

<div class="card submit-form-card">
    <form id="ticket-form" class="ticket-form">
        <div class="form-group">
            <label for="requester_name">Your Name</label>
            <input 
                type="text" 
                id="requester_name" 
                name="requester_name" 
                placeholder="Enter your name"
                class="form-input"
            >
        </div>
        
        <div class="form-group">
            <label for="requester_email">Email (optional)</label>
            <input 
                type="email" 
                id="requester_email" 
                name="requester_email" 
                placeholder="your.email@company.com"
                class="form-input"
            >
        </div>
        
        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input 
                type="text" 
                id="title" 
                name="title" 
                required
                minlength="5"
                maxlength="255"
                placeholder="Brief summary of your request"
                class="form-input"
            >
        </div>
        
        <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea 
                id="description" 
                name="description" 
                required
                minlength="10"
                rows="6"
                placeholder="Please describe your issue in detail. Include:
- What you're trying to accomplish
- What's happening vs what you expected
- Any error messages or relevant details
- Urgency and impact"
                class="form-input"
            ></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">
                <span class="btn-text">Submit Request</span>
                <span class="btn-loading" style="display: none;">
                    <span class="spinner"></span> Analyzing...
                </span>
            </button>
        </div>
    </form>
</div>

<div id="result-section" class="result-section" style="display: none;">
    <div class="card success-card">
        <div class="success-icon">&#10003;</div>
        <h2>Request Submitted Successfully!</h2>
        <p id="result-summary"></p>
        <div id="teams-routed" class="teams-routed"></div>
        <a id="view-ticket-link" href="#" class="btn btn-primary">View Ticket Progress</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('ticket-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submit-btn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoading = submitBtn.querySelector('.btn-loading');
    
    // Show loading state
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline-flex';
    submitBtn.disabled = true;
    
    const formData = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        requester_name: document.getElementById('requester_name').value || 'Anonymous',
        requester_email: document.getElementById('requester_email').value || null
    };
    
    try {
        const response = await fetch('/tickets', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to submit ticket');
        }
        
        const ticket = await response.json();
        
        // Hide form, show result
        document.querySelector('.submit-form-card').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        
        // Populate result
        const triage = ticket.triage_result || {};
        document.getElementById('result-summary').textContent = 
            triage.summary || 'Your request has been received.';
        
        const teamsDiv = document.getElementById('teams-routed');
        if (triage.teams && triage.teams.length > 0) {
            teamsDiv.innerHTML = '<p><strong>Routed to:</strong></p>' +
                triage.teams.map(t => `<span class="team-badge">${t.team_name}</span>`).join('');
        }
        
        document.getElementById('view-ticket-link').href = `/tickets/${ticket.id}/view`;
        
    } catch (error) {
        alert('Error: ' + error.message);
        // Reset button
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        submitBtn.disabled = false;
    }
});
</script>
{% endblock %}
