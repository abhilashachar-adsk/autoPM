<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Support Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">Support Agent</a>
        </div>
        <div class="nav-links">
            <a href="/">New Request</a>
            <a href="/tickets/list">My Tickets</a>
            <div class="dropdown">
                <button class="dropdown-btn">Team Channels</button>
                <div class="dropdown-content" id="channels-dropdown">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
